<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Embed</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Container used for perfect centering -->
    <main class="video-container">

        <!-- Locally hosted video -->
        <video 
            controls 
            loop 
            poster="dog.jpeg"
            class="video-player">

            <source src="barking.mp4" type="video/mp4">

        </video>

    </main>

</body>
</html>
