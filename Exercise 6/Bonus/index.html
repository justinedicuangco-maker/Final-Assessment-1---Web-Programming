<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Guessing Game</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Main game container -->
<main class="game-container">

    <!-- Header -->
    <h1>RGB Colour Guessing Game</h1>

    <!-- RGB target display -->
    <h2 id="rgbValue">RGB(?, ?, ?)</h2>

    <!-- Lives -->
    <p id="lives">Lives: 3</p>

    <!-- Message feedback -->
    <p id="message"></p>

    <!-- Colour options -->
    <section id="options" class="options"></section>

    <!-- Score screen -->
    <div id="gameOver" class="hidden">
        <h2>Game Over</h2>
        <p id="finalScore"></p>
        <button id="restartBtn">Play Again</button>
    </div>

</main>

<!-- JavaScript -->
<script src="index.js"></script>

</body>
</html>
