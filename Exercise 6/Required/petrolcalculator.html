<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petrol Calculator</title>

    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main calculator container -->
    <main class="calculator">

        <h1>Petrol Calculator</h1>

        <!-- Input for cost per litre -->
        <label for="cost">Cost per litre (£)</label>
        <input 
            type="number" 
            id="cost" 
            value="1.72" 
            step="0.01"
        >

        <!-- Input for litres purchased -->
        <label for="litres">Litres purchased</label>
        <input 
            type="number" 
            id="litres" 
            value="0"
            step="0.01"
        >

        <!-- Calculate button -->
        <button id="calculateBtn">Calculate Total</button>

        <!-- Output -->
        <p class="result">
            Total cost: £<span id="total">0.00</span>
        </p>

    </main>

    <!-- Link to JavaScript -->
    <script src="script.js"></script>

</body>
</html>
